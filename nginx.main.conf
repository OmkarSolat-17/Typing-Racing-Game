# Main-context config for the unprivileged container image.
#
# The official image ships a root-oriented `/etc/nginx/nginx.conf` (it sets `user nginx;` and
# `pid /var/run/nginx.pid;`). Our runtime stage runs as an arbitrary uid, which is the usual
# way an nginx container ends up printing four friendly `[notice]` lines and then exiting 1:
# the master cannot write the pid file where the distro config tells it to. Owning this file
# is what makes "run unprivileged on :8080" a property of the image instead of a hope.
#
# The site itself lives in /etc/nginx/conf.d/default.conf (see nginx.conf at the repo root),
# which is why this file has no `server` block.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    # Container logs, not log files: nothing here needs a writable /var/log.
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
