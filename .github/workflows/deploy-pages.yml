name: Deploy (GitHub Pages)

# Publishing is deliberately separate from CI: `ci.yml` decides *whether* a commit is good
# enough, this job decides where it goes. Only `master` (or a manual run) ships.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway through; queue it instead.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `verify` is format:check → lint → typecheck → tests → build, so a deploy cannot
      # publish something the local workflow would have rejected.
      - run: npm ci
      - run: npm run verify

      # Deliberately a check, not a fix. Changing where a site publishes from is a hosting
      # decision: the workflow token gets 403 "Resource not accessible by integration" on that
      # endpoint (as does any non-owner token), and a deploy silently mutating repo settings
      # would be wrong even if it could. So fail with the exact click instead — the failure mode
      # being guarded is real: branch mode over the repo root publishes index.html pointing at
      # /src/main.tsx, i.e. an unrunnable page that looks "deployed".
      - name: Pages must be sourced from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! source_mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type'); then
            echo "::error::could not read the Pages configuration for ${GITHUB_REPOSITORY}"
            exit 1
          fi
          echo "Pages build_type: ${source_mode}"
          if [ "${source_mode}" != "workflow" ]; then
            echo "::error::Pages is in '${source_mode}' mode, which publishes the repo root through Jekyll — for a Vite app that is untranspiled source, not a site. Fix: Settings → Pages → Build and deployment → Source: 'GitHub Actions', then re-run this workflow. The artifact itself is fine: dist/index.html, $(du -h dist/index.html | cut -f1)."
            exit 1
          fi

      # The artifact is a single self-contained `dist/index.html` (vite-plugin-singlefile)
      # plus the files in `public/`; there is no asset tree to keep in sync.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.outputs.outputs.page_url }}
    steps:
      - id: outputs
        uses: actions/deploy-pages@v4
