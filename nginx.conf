# KEYRUSH static hosting, designed to run unprivileged on :8080 (see Dockerfile).
#
# This file is pulled in by the stock image's `include /etc/nginx/conf.d/*.conf;`, i.e. it
# lives *inside* the http block: it must contain no main-context directives. The pid path,
# the user and the error log stay in /etc/nginx/nginx.conf, where they already are.

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Inheritance rule that bites: a location declaring *any* `add_header` replaces the
    # inherited set instead of extending it. So every response header is declared once here
    # and the locations below only override `Cache-Control` — which is why the HTML entry
    # point (the only path that used to carry its own header) no longer strips the policy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # `unsafe-inline` for script/style is forced by vite-plugin-singlefile: the bundle is
    # inlined into the document. Fonts are self-hosted latin subsets, so no third-party
    # origin appears in this policy at all (a stale https://fonts.gstatic.com allowance was
    # removed together with the @import in src/index.css). Dropping the plugin is the only
    # way to make the policy strict; the payload budget in CI is what keeps it honest.

    # The document *is* the app: never cache it, always revalidate.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain image/svg+xml application/javascript application/json;

    # For a future build that emits hashed sub-resources. Today's single-file artifact has
    # none, so this block is inert; it re-lists the two headers that matter for code and
    # fonts because the Cache-Control below replaces the server-level set.
    location ~* \.[0-9a-zA-Z_-]{6,}\.(js|css|woff2?)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
