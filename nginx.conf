# KEYRUSH static hosting, designed to run unprivileged on :8080 (see Dockerfile).
# Included from the stock nginx.conf's http block, so it must contain no main-context
# directives (the pid file is set by the CMD in the Dockerfile).

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # vite-plugin-singlefile inlines the bundle into index.html, which is why
    # script-src/style-src need 'unsafe-inline'. Drop the plugin for a strict CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain image/svg+xml application/javascript application/json;

    # Hashed assets are immutable forever; the HTML entrypoint must always revalidate.
    location ~* \.[0-9a-zA-Z_-]{6,}\.(js|css|woff2?)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
